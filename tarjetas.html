<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjetas postales para enviar por correo · Postalbird</title>
<meta name="description" content="Tarjetas postales de cumpleaños, amor, amistad, agradecimiento, Navidad, bodas, Día de la Madre y del Padre. Elige la tuya y la enviamos con tu dedicatoria en letra manuscrita.">
<link rel="icon" href="img/marca.png" type="image/png">
<link rel="preload" href="fonts/AmaticSC-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tarjetas">
<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="page-head">
      <span class="eyebrow">Catálogo</span>
      <h1 id="titulo">Tarjetas postales</h1>
      <p id="intro">Elige la que más te guste. Después escribes tu dedicatoria y nos dices a quién se la enviamos.</p>
    </div>

    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
      <div class="search"><label class="sr" for="q">Buscar postales</label><input id="q" type="search" placeholder="Buscar: mamá, cumpleaños, gato…" autocomplete="off"></div>
    </div>

    <p class="muted" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden><h3>No hay postales con esa búsqueda</h3><p>Prueba con otra palabra o vuelve a «Todas».</p></div>
    <div class="more"><button class="btn ghost" id="more" type="button" hidden>Mostrar más postales</button></div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/catalog.js"></script>
<script src="js/site.js"></script>
<script src="js/tienda.js"></script>
</body>
</html>
